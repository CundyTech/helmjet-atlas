apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: helmjet-atlas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
      - name: mongo
        image: mongo:6.0
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_DATABASE
          value: helmjet-atlas
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: helmjet-atlas
spec:
  selector:
    app: mongo
  ports:
  - port: 27017
    targetPort: 27017
  type: ClusterIP
