openapi: 3.0.0
info:
  title: HelmJet Atlas API
  description: REST API for visualizing Kubernetes microservices topology and NATS Jetstream message bus architecture
  version: 1.0.0
  contact:
    name: HelmJet Atlas
    url: https://github.com/helmjet/atlas
  license:
    name: MIT

servers:
- url: http://localhost:8080
  description: Development server
- url: https://api.example.com
  description: Production server

paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns the health status of the API server
      operationId: getHealth
      tags:
      - Health
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"

  /api/v1/microservices:
    post:
      summary: Create a new microservice
      operationId: createMicroservice
      tags:
      - Microservices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MicroserviceInput'
      responses:
        '201':
          description: Microservice created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: objectid
                    example: "507f1f77bcf86cd799439011"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      summary: List microservices
      operationId: listMicroservices
      tags:
      - Microservices
      parameters:
      - name: namespace
        in: query
        description: Filter by namespace
        schema:
          type: string
      - name: cluster
        in: query
        description: Filter by cluster
        schema:
          type: string
      - name: status
        in: query
        description: Filter by status
        schema:
          type: string
          enum: [ Running, Pending, Failed, Unknown ]
      - name: limit
        in: query
        description: Maximum number of results
        schema:
          type: integer
          default: 100
          minimum: 1
      - name: skip
        in: query
        description: Number of results to skip
        schema:
          type: integer
          default: 0
          minimum: 0
      responses:
        '200':
          description: List of microservices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Microservice'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/microservices/{id}:
    get:
      summary: Get a specific microservice
      operationId: getMicroservice
      tags:
      - Microservices
      parameters:
      - name: id
        in: path
        required: true
        description: Microservice ID
        schema:
          type: string
          format: objectid
      responses:
        '200':
          description: Microservice details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Microservice'
        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Microservice not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update a microservice
      operationId: updateMicroservice
      tags:
      - Microservices
      parameters:
      - name: id
        in: path
        required: true
        description: Microservice ID
        schema:
          type: string
          format: objectid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MicroserviceInput'
      responses:
        '200':
          description: Microservice updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "updated"
        '400':
          description: Bad request
