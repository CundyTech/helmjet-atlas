components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: "invalid ID"
      required:
      - error

    Port:
      type: object
      properties:
        name:
          type: string
          example: "http"
        containerPort:
          type: integer
          example: 8080
        protocol:
          type: string
          enum: [ TCP, UDP ]
      required:
      - name
      - containerPort
      - protocol

    MicroserviceInput:
      type: object
      properties:
        name:
          type: string
          example: "order-service"
        namespace:
          type: string
          example: "default"
        cluster:
          type: string
          example: "prod"
        image:
          type: string
          example: "order-service:1.0.0"
        replicas:
          type: integer
          example: 3
        status:
          type: string
          enum: [ Running, Pending, Failed, Unknown ]
          example: "Running"
        labels:
          type: object
          additionalProperties:
            type: string
          example:
            app: "orders"
            version: "v1"
        ports:
          type: array
          items:
            $ref: '#/components/schemas/Port'
      required:
      - name
      - namespace
      - cluster
      - image
      - replicas
      - status

    Microservice:
      allOf:
      - $ref: '#/components/schemas/MicroserviceInput'
      - type: object
        properties:
          id:
            type: string
            format: objectid
            example: "507f1f77bcf86cd799439011"
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
          lastSyncedAt:
            type: string
            format: date-time
        required:
        - id
        - createdAt
        - updatedAt

    Retention:
      type: object
      properties:
        policy:
          type: string
          enum: [ limits, interest, workqueue ]
          example: "limits"
        maxAge:
          type: integer
          description: Maximum age in milliseconds
          example: 604800000
        maxBytes:
          type: integer
          description: Maximum bytes
          example: 1073741824
        maxMsgs:
          type: integer
          description: Maximum messages
          example: 1000000

    NATSStreamInput:
      type: object
      properties:
        name:
          type: string
          example: "orders-stream"
        cluster:
          type: string
          example: "default"
        subjects:
          type: array
          items:
            type: string
          example: [ "orders.>" ]
        retention:
          $ref: '#/components/schemas/Retention'
        replicas:
          type: integer
          example: 3
        storage:
          type: string
          enum: [ file, memory ]
          example: "file"
      required:
      - name
      - cluster
      - subjects

    NATSStream:
      allOf:
      - $ref: '#/components/schemas/NATSStreamInput'
      - type: object
        properties:
          id:
            type: string
            format: objectid
            example: "507f1f77bcf86cd799439012"
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
          lastSyncedAt:
            type: string
            format: date-time
        required:
        - id
        - createdAt
        - updatedAt

    DeliveryPolicy:
      type: object
      properties:
        type:
          type: string
          enum: [ all, last, new, byStartTime, byStartSeq ]
          example: "all"
        startTime:
          type: string
          format: date-time
          nullable: true
        startSeq:
          type: integer
          nullable: true
          example: 0

    NATSConsumerInput:
      type: object
      properties:
        name:
          type: string
          example: "order-processor"
        streamName:
          type: string
          example: "orders-stream"
        cluster:
          type: string
          example: "default"
        consumerGroup:
          type: string
          example: "order-processors"
        subjects:
          type: array
          items:
            type: string
          example: [ "orders.created" ]
        deliveryPolicy:
          $ref: '#/components/schemas/DeliveryPolicy'
        ackPolicy:
          type: string
          enum: [ explicit, implicit, none ]
          example: "explicit"
        ackWait:
          type: integer
          description: Acknowledgment wait time in milliseconds
          example: 30000
        maxDeliver:
          type: integer
          example: 5
        rateLimit:
          type: integer
          description: Rate limit in bytes per second
          example: 0
        status:
          type: string
          enum: [ active, inactive ]
          example: "active"
      required:
      - name
      - streamName
      - cluster
      - consumerGroup

    NATSConsumer:
      allOf:
      - $ref: '#/components/schemas/NATSConsumerInput'
      - type: object
        properties:
          id:
            type: string
            format: objectid
            example: "507f1f77bcf86cd799439013"
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
          lastSyncedAt:
            type: string
            format: date-time
        required:
        - id
        - createdAt
        - updatedAt

    ServiceStreamLinkInput:
      type: object
      properties:
        sourceServiceId:
          type: string
          format: objectid
          example: "507f1f77bcf86cd799439011"
        targetStreamId:
          type: string
          format: objectid
          example: "507f1f77bcf86cd799439012"
        linkType:
          type: string
          enum: [ publisher, subscriber ]
          example: "publisher"
        cluster:
          type: string
          example: "default"
        messageCount:
          type: integer
          example: 15000
        throughputMsgsPerSec:
          type: number
          format: double
          example: 42.5
        errorRate:
          type: number
          format: double
          example: 0.001
      required:
      - sourceServiceId
      - targetStreamId
      - linkType
      - cluster

    ServiceStreamLink:
      allOf:
      - $ref: '#/components/schemas/ServiceStreamLinkInput'
      - type: object
        properties:
          id:
            type: string
            format: objectid
            example: "507f1f77bcf86cd799439014"
          lastMessageAt:
            type: string
            format: date-time
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
        required:
        - id
        - createdAt
        - updatedAt

    ConsumerServiceLinkInput:
      type: object
      properties:
        consumerId:
          type: string
          format: objectid
          example: "507f1f77bcf86cd799439013"
        serviceId:
          type: string
          format: objectid
          example: "507f1f77bcf86cd799439011"
        cluster:
          type: string
          example: "default"
        lagBytes:
          type: integer
          example: 1024
        lagMessages:
          type: integer
          example: 50
        consumerRate:
          type: number
          format: double
          example: 100.5
      required:
      - consumerId
      - serviceId
      - cluster

    ConsumerServiceLink:
      allOf:
      - $ref: '#/components/schemas/ConsumerServiceLinkInput'
      - type: object
        properties:
          id:
            type: string
            format: objectid
            example: "507f1f77bcf86cd799439015"
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
        required:
        - id
        - createdAt
        - updatedAt

